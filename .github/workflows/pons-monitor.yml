name: PONS price monitor

on:
  workflow_dispatch:
    inputs:
      force_alert:
        description: Force a test alert
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - agent.py
      - .github/workflows/pons-monitor.yml

permissions:
  contents: read
  issues: write

jobs:
  check-pons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check PONS price
        id: pons
        env:
          PONS_ALERT_ABOVE_USD: ${{ vars.PONS_ALERT_ABOVE_USD || '1' }}
          FORCE_ALERT: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_alert) }}
        run: python3 agent.py

      - name: Report alert
        if: steps.pons.outputs.should_alert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRICE: ${{ steps.pons.outputs.price }}
          THRESHOLD: ${{ steps.pons.outputs.threshold }}
          FORCED: ${{ steps.pons.outputs.forced }}
        run: |
          echo "::warning title=PONS price alert::PONS is \$${PRICE} USD (threshold \$${THRESHOLD}, forced: ${FORCED})"
          {
            echo "## PONS price alert"
            echo "PONS is currently **\$${PRICE} USD** (threshold **\$${THRESHOLD} USD**, forced: **${FORCED}**)"
          } >> "$GITHUB_STEP_SUMMARY"
          has_issues="$(gh repo view --json hasIssuesEnabled --jq .hasIssuesEnabled)"
          if [ "$has_issues" != "true" ]; then
            echo "Issues are disabled; skipping issue creation."
            exit 0
          fi
          count="$(gh issue list --state open --search 'PONS price alert in:title' --json number --jq 'length')"
          if [ "$count" = "0" ]; then
            gh issue create \
              --title "PONS price alert" \
              --body "PONS is currently **\$${PRICE} USD**. Threshold: **\$${THRESHOLD} USD**. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
